<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Alchemist | v2.5</title>
    <style>
        :root {
            --accent: #00e0ff;
            --bg: #050506;
            --panel: #111114;
            --text: #e0e0e0;
        }

        body {
            margin: 0; background: var(--bg); color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            display: grid; grid-template-columns: 280px 1fr 350px;
            height: 100vh; overflow: hidden; /* Prevents whole page scroll */
        }

        /* --- SIDEBARS --- */
        .sidebar, .library { 
            background: var(--panel); 
            padding: 20px; 
            border-right: 1px solid #222; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; /* Lock to screen height */
            box-sizing: border-box;
        }

        /* --- SCROLLABLE LIBRARY --- */
        .inventory-container {
            flex-grow: 1; 
            overflow-y: auto; /* ENABLE SCROLLING */
            margin-top: 10px;
            padding-right: 5px;
        }

        /* Custom Scrollbar Styling */
        .inventory-container::-webkit-scrollbar { width: 5px; }
        .inventory-container::-webkit-scrollbar-track { background: #000; }
        .inventory-container::-webkit-scrollbar-thumb { background: var(--accent); }

        .element-card {
            background: rgba(255,255,255,0.05); padding: 12px; border-radius: 4px;
            cursor: pointer; border: 1px solid #222; transition: 0.2s;
            margin-bottom: 5px; text-transform: uppercase; font-size: 0.8em;
        }
        .element-card:hover { 
            background: rgba(0,224,255,0.1); 
            border-color: var(--accent);
            transform: translateX(5px);
        }

        /* --- CENTER CRUCIBLE --- */
        .crucible { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            padding: 40px; text-align: center;
        }
        .input-group { display: flex; gap: 15px; margin-bottom: 30px; align-items: center; }
        
        input { 
            background: #000; border: 2px solid #222; color: var(--accent); 
            padding: 18px; width: 200px; text-align: center;
            border-radius: 8px; font-weight: bold;
        }

        button.transmute {
            background: var(--accent); color: #000; border: none;
            padding: 20px 60px; font-weight: bold; cursor: pointer;
            border-radius: 8px; font-size: 1.1em;
        }

        .stat-box { background: #000; padding: 15px; border-left: 4px solid var(--accent); margin-bottom: 20px; }
        #log { min-height: 120px; color: #888; font-size: 0.9em; margin-top: 20px; }

        #victory {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            z-index: 9999; flex-direction: column; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

    <div id="victory">
        <h1 style="color:var(--accent)">SELF-ACTUALIZATION ATTAINED</h1>
        <p>The loop is closed. Reality and Thought are one.</p>
        <button class="transmute" onclick="resetGame()">RESTART SYSTEM</button>
    </div>

    <div class="sidebar">
        <h2>METRICS</h2>
        <div class="stat-box">
            <small>INNOVATION</small><br>
            <span id="inn" style="font-size: 1.5em; color:var(--accent)">0</span>
        </div>
        <div class="stat-box" style="border-color: #ff4444;">
            <small>DEGRADATION</small><br>
            <span id="deg" style="font-size: 1.5em; color:#ff4444">0</span>
        </div>
        <button onclick="clearCrucible()" style="margin-top:auto; background:none; border:1px solid #444; color:#888; padding:10px; cursor:pointer;">CLEAR INPUTS</button>
    </div>

    <div class="crucible">
        <h1 style="opacity: 0.5;">[ CORE CRUCIBLE ]</h1>
        <div class="input-group">
            <input type="text" id="el1" placeholder="ALPHA" readonly>
            <span>+</span>
            <input type="text" id="el2" placeholder="BETA" readonly>
        </div>
        <button class="transmute" onclick="combine()">TRANSMUTE</button>
        <div id="log">Select elements from the library to begin.</div>
    </div>

    <div class="library">
        <h2>LIBRARY</h2>
        <input type="text" id="search" placeholder="FILTER DATA..." onkeyup="filterLibrary()" 
               style="width:100%; box-sizing:border-box; margin-bottom:10px; padding:12px; background:#000; border:1px solid #333; color:#fff;">
        
        <div class="inventory-container" id="inv">
            </div>
    </div>

    <script>
        // --- SAVE SYSTEM ---
        // Load existing data or start fresh
        let gameState = JSON.parse(localStorage.getItem('alchemist_save_v2')) || {
            inventory: ["electricity", "metal", "logic", "vacuum", "sand", "petroleum", "fire", "water", "dna", "sunlight", "uranium", "coal", "ethics"],
            innovation: 0,
            degradation: 0
        };

        function saveGame() {
            localStorage.setItem('alchemist_save_v2', JSON.stringify(gameState));
            render();
        }

        function resetGame() {
            if(confirm("Wipe all system data?")) {
                localStorage.removeItem('alchemist_save_v2');
                location.reload();
            }
        }

        // --- UI LOGIC ---
        function selectElement(name) {
            const e1 = document.getElementById('el1');
            const e2 = document.getElementById('el2');
            
            // Set Alpha first, then Beta
            if (!e1.value) e1.value = name;
            else if (!e2.value) e2.value = name;
            else {
                e1.value = name;
                e2.value = "";
            }
        }

        function clearCrucible() {
            document.getElementById('el1').value = "";
            document.getElementById('el2').value = "";
        }

        function filterLibrary() {
            const q = document.getElementById('search').value.toLowerCase();
            document.querySelectorAll('.element-card').forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(q) ? "block" : "none";
            });
        }

        async function combine() {
    const el1 = document.getElementById('el1').value.replace(/\s+/g, '_').toLowerCase();
    const el2 = document.getElementById('el2').value.replace(/\s+/g, '_').toLowerCase();

    if (!el1 || !el2) return;

    const res = await fetch('/combine', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ el1, el2, inventory: gameState.inventory })
    });
    const data = await res.json();

    if (data.success) {
        // IMPORTANT: Standardize the key to underscores
        const resKey = data.discovery.replace(/\s+/g, '_').toLowerCase();
        
        if (!gameState.inventory.includes(resKey)) {
            gameState.inventory.push(resKey);
            
            // Add the points - Ensure these are numbers
            gameState.innovation += Number(data.innovation);
            gameState.degradation += Number(data.degradation);
            
            document.getElementById('log').innerHTML = `
                <div style="color:var(--accent); font-weight:bold;">NEW DATA: ${data.discovery}</div>
                <div style="font-size:0.8em;">+${data.innovation} Innovation</div>
                <p>${data.lore}</p>
            `;
        } else {
            document.getElementById('log').innerText = `Redundant discovery: ${data.discovery}`;
        }
        saveGame();
        clearCrucible();
    } else {
        document.getElementById('log').innerText = data.message;
    }
}
        function render() {
            document.getElementById('inn').innerText = gameState.innovation;
            document.getElementById('deg').innerText = gameState.degradation;
            
            const grid = document.getElementById('inv');
            grid.innerHTML = "";
            
            // Sort alphabetical for easier finding
            gameState.inventory.sort().forEach(item => {
                const card = document.createElement('div');
                card.className = 'element-card';
                card.innerText = item.replace(/_/g, ' ');
                card.onclick = () => selectElement(item);
                grid.appendChild(card);
            });
        }

        render();
    </script>
</body>
</html>
